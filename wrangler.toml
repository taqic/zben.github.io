name = "zbens"
compatibility_date = "2026-07-18"
pages_build_output_dir = "."

# 在 Cloudflare Dashboard 创建 D1 后，把 database_id 填到这里
[[d1_databases]]
binding = "DB"
database_name = "zbens-feedback"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 可选：大文件下载桶（Dashboard 创建后填写）
# [[r2_buckets]]
# binding = "DOWNLOADS"
# bucket_name = "zbens-downloads"
