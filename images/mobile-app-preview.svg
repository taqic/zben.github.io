<svg width="300" height="500" viewBox="0 0 300 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone body -->
  <rect x="50" y="20" width="200" height="460" fill="url(#phoneGradient)" rx="30"/>
  <rect x="60" y="30" width="180" height="440" fill="url(#screenGradient)" rx="25"/>
  
  <!-- Home indicator -->
  <rect x="130" y="450" width="40" height="4" fill="#6b7280" rx="2"/>
  
  <!-- Status bar -->
  <rect x="70" y="40" width="160" height="20" fill="#f1f5f9"/>
  <circle cx="80" cy="50" r="3" fill="#10b981"/>
  <text x="90" y="55" font-family="Arial, sans-serif" font-size="8" fill="#374151">9:41</text>
  <text x="220" y="55" font-family="Arial, sans-serif" font-size="8" fill="#374151">100%</text>
  
  <!-- App header -->
  <rect x="70" y="70" width="160" height="40" fill="#4f46e5"/>
  <text x="150" y="90" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Smart Noise Monitor</text>
  <text x="150" y="105" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe" text-anchor="middle">Real-time monitoring</text>
  
  <!-- Main content area -->
  <rect x="80" y="120" width="140" height="200" fill="white" rx="8"/>
  
  <!-- Noise level indicator -->
  <circle cx="150" cy="180" r="40" fill="none" stroke="#e5e7eb" stroke-width="8"/>
  <circle cx="150" cy="180" r="40" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="200" stroke-dashoffset="50" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="200;50;200" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Center text -->
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="16" fill="#374151" text-anchor="middle" font-weight="bold">45 dB</text>
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Normal</text>
  
  <!-- Microphone icon -->
  <g transform="translate(150, 250)">
    <rect x="-8" y="-15" width="16" height="20" fill="#4f46e5" rx="2"/>
    <rect x="-4" y="-20" width="8" height="5" fill="#4f46e5" rx="1"/>
    <line x1="0" y1="5" x2="0" y2="15" stroke="#4f46e5" stroke-width="2"/>
    <line x1="-5" y1="15" x2="5" y2="15" stroke="#4f46e5" stroke-width="2"/>
  </g>
  
  <!-- Control buttons -->
  <rect x="90" y="340" width="50" height="30" fill="#4f46e5" rx="15"/>
  <text x="115" y="360" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Start</text>
  
  <rect x="160" y="340" width="50" height="30" fill="#ef4444" rx="15"/>
  <text x="185" y="360" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Stop</text>
  
  <!-- History section -->
  <rect x="80" y="390" width="140" height="60" fill="#f8fafc" rx="8"/>
  <text x="90" y="405" font-family="Arial, sans-serif" font-size="10" fill="#374151" font-weight="bold">Recent Readings</text>
  
  <!-- History bars -->
  <rect x="90" y="415" width="8" height="20" fill="#10b981"/>
  <rect x="105" y="410" width="8" height="25" fill="#f59e0b"/>
  <rect x="120" y="420" width="8" height="15" fill="#10b981"/>
  <rect x="135" y="405" width="8" height="30" fill="#ef4444"/>
  <rect x="150" y="415" width="8" height="20" fill="#10b981"/>
  <rect x="165" y="410" width="8" height="25" fill="#f59e0b"/>
  <rect x="180" y="420" width="8" height="15" fill="#10b981"/>
  <rect x="195" y="405" width="8" height="30" fill="#ef4444"/>
  <rect x="210" y="415" width="8" height="20" fill="#10b981"/>
</svg>
