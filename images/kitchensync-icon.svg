<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="kitchenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#kitchenGradient)" opacity="0.1"/>
  
  <!-- Recipe book base -->
  <rect x="60" y="50" width="80" height="100" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  
  <!-- Recipe book pages -->
  <line x1="100" y1="50" x2="100" y2="150" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Recipe text lines -->
  <line x1="70" y1="70" x2="95" y2="70" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="85" x2="95" y2="85" stroke="#6366f1" stroke-width="2" opacity="0.4"/>
  <line x1="70" y1="100" x2="90" y2="100" stroke="#6366f1" stroke-width="2" opacity="0.4"/>
  
  <line x1="105" y1="70" x2="130" y2="70" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="105" y1="85" x2="130" y2="85" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <line x1="105" y1="100" x2="125" y2="100" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  
  <!-- Cooking pot icon -->
  <ellipse cx="100" cy="125" rx="20" ry="8" fill="#6366f1" opacity="0.8"/>
  <path d="M 80 125 L 85 140 L 115 140 L 120 125 Z" fill="#6366f1" opacity="0.8"/>
  <ellipse cx="100" cy="140" rx="15" ry="5" fill="#8b5cf6" opacity="0.6"/>
  
  <!-- Sync arrows (circular) -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.2" stroke-dasharray="5,5"/>
  <path d="M 140 100 L 150 90 L 150 110 Z" fill="#6366f1" opacity="0.6"/>
  <path d="M 60 100 L 50 90 L 50 110 Z" fill="#8b5cf6" opacity="0.6"/>
</svg>

