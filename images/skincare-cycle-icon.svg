<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Outer Ring (Cycle representation) -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#gradient1)" stroke-width="3" opacity="0.3"/>
  
  <!-- Circular Arrow (Cycle symbol) -->
  <path d="M 75 30 Q 90 35, 90 50 Q 90 65, 85 70" 
        fill="none" 
        stroke="url(#gradient1)" 
        stroke-width="4" 
        stroke-linecap="round"
        stroke-linejoin="round"
        marker-end="url(#arrowhead)"/>
  
  <!-- Main Droplet (Skincare/Product) -->
  <path d="M 60 20 Q 50 25, 50 40 Q 50 50, 55 55 Q 60 60, 65 55 Q 70 50, 70 40 Q 70 25, 60 20 Z" 
        fill="url(#gradient1)"
        opacity="0.9"/>
  
  <!-- Secondary Droplet (Additional Product) -->
  <path d="M 45 55 Q 40 58, 40 65 Q 40 70, 43 73 Q 46 76, 50 73 Q 52 70, 52 65 Q 52 58, 45 55 Z" 
        fill="url(#gradient2)"
        opacity="0.8"/>
  
  <!-- Third Droplet (Another Product) -->
  <path d="M 75 55 Q 80 58, 80 65 Q 80 70, 77 73 Q 74 76, 70 73 Q 68 70, 68 65 Q 68 58, 75 55 Z" 
        fill="url(#gradient2)"
        opacity="0.8"/>
  
  <!-- Inner Circle with Skin Pattern (Represents skin/tracking) -->
  <circle cx="60" cy="75" r="12" fill="url(#gradient2)" opacity="0.6"/>
  <circle cx="60" cy="75" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Small dots representing tracking points -->
  <circle cx="55" cy="72" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="60" cy="70" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="65" cy="72" r="1.5" fill="#ffffff" opacity="0.9"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" 
            refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="url(#gradient1)" />
    </marker>
  </defs>
</svg>

