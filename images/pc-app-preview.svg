<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monitorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Monitor base -->
  <rect x="150" y="200" width="100" height="20" fill="url(#monitorGradient)" rx="4"/>
  <rect x="170" y="180" width="20" height="40" fill="url(#monitorGradient)"/>
  
  <!-- Monitor screen -->
  <rect x="50" y="50" width="300" height="180" fill="url(#monitorGradient)" rx="8"/>
  <rect x="60" y="60" width="280" height="160" fill="url(#screenGradient)" rx="4"/>
  
  <!-- Application interface -->
  <!-- Title bar -->
  <rect x="60" y="60" width="280" height="30" fill="#4f46e5"/>
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Productivity Suite</text>
  
  <!-- Menu bar -->
  <rect x="60" y="90" width="280" height="20" fill="#f1f5f9"/>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="8" fill="#374151">File</text>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="8" fill="#374151">Edit</text>
  <text x="130" y="105" font-family="Arial, sans-serif" font-size="8" fill="#374151">View</text>
  <text x="160" y="105" font-family="Arial, sans-serif" font-size="8" fill="#374151">Tools</text>
  <text x="190" y="105" font-family="Arial, sans-serif" font-size="8" fill="#374151">Help</text>
  
  <!-- Sidebar -->
  <rect x="60" y="110" width="80" height="110" fill="#f8fafc"/>
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="9" fill="#374151" font-weight="bold">Projects</text>
  <rect x="70" y="130" width="60" height="15" fill="#e5e7eb" rx="2"/>
  <text x="75" y="140" font-family="Arial, sans-serif" font-size="7" fill="#6b7280">Project 1</text>
  <rect x="70" y="150" width="60" height="15" fill="#4f46e5" rx="2"/>
  <text x="75" y="160" font-family="Arial, sans-serif" font-size="7" fill="white">Project 2</text>
  <rect x="70" y="170" width="60" height="15" fill="#e5e7eb" rx="2"/>
  <text x="75" y="180" font-family="Arial, sans-serif" font-size="7" fill="#6b7280">Project 3</text>
  
  <!-- Main content area -->
  <rect x="150" y="110" width="190" height="110" fill="white"/>
  
  <!-- Document content -->
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="10" fill="#374151" font-weight="bold">Document Title</text>
  <line x1="160" y1="135" x2="330" y2="135" stroke="#e5e7eb" stroke-width="1"/>
  
  <text x="160" y="150" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</text>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Sed do eiusmod tempor incididunt ut labore et dolore.</text>
  <text x="160" y="180" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Magna aliqua. Ut enim ad minim veniam, quis nostrud.</text>
  
  <!-- Status bar -->
  <rect x="60" y="200" width="280" height="20" fill="#f1f5f9"/>
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Ready</text>
  <text x="300" y="215" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Page 1 of 1</text>
  
  <!-- Keyboard -->
  <rect x="80" y="230" width="240" height="15" fill="#374151" rx="2"/>
  <rect x="90" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="105" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="120" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="135" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="150" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="165" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="180" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="195" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="210" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="225" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="240" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="255" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="270" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="285" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  <rect x="300" y="235" width="8" height="5" fill="#6b7280" rx="1"/>
  
  <!-- Mouse -->
  <ellipse cx="350" cy="250" rx="15" ry="8" fill="#374151"/>
  <ellipse cx="350" cy="250" rx="10" ry="5" fill="#6b7280"/>
</svg>
